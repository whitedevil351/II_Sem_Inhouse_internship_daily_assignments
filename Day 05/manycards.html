<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>User Card Grid</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
body{background:#f5f7fa}
.profile{width:90px;height:90px;border-radius:50%;object-fit:cover}
.even{background:#94d3c5}
</style>
</head>
<body>

<div class="container py-4">
<h2 class="text-center fw-bold">User Card Grid</h2>
<p class="text-center text-muted">Fetch API + Bootstrap + jQuery</p>

<input id="search" class="form-control mb-3" placeholder="Search user">

    <h5 id="count" class="text-center text-success"></h5>

   <div id="loading" class="text-center my-4">
      <div class="spinner-border text-primary"></div>
        <p class="mt-2">Loading Users...</p>
  </div>

<div id="error" class="alert alert-danger d-none"></div>

<div id="user-container" class="row g-3"></div>
</div>

<div class="modal fade" id="profileModal">
<div class="modal-dialog">
<div class="modal-content">
<div class="modal-header">
<h5 class="modal-title">User Profile</h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body" id="profileBody"></div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
let users=[];

$(function(){
 fetchUsers();

 $("#search").on("keyup",function(){
   let v=$(this).val().toLowerCase();
   show(users.filter(u=>(u.firstName+" "+u.lastName).toLowerCase().includes(v)));
 });
});

function fetchUsers(){
fetch("https://dummyjson.com/users")
.then(r=>{
 if(!r.ok) throw Error("API Error");
 return r.json();
})
.then(d=>{
 users=d.users;
 $("#loading").hide();
 $("#count").text("Showing "+users.length+" Users");
 show(users);
})
.catch(()=>{
 $("#loading").hide();
 $("#error").removeClass("d-none").text("Unable to fetch users.");
});
}

function show(data){
let cards="";
data.forEach((u,i)=>{
cards+=`
<div class="col-lg-3 col-md-4 col-sm-6">
<div class="card h-100 shadow ${i%2==0?"even":""}">
<div class="card-body text-center">
<img src="https://i.pravatar.cc/150?img=${u.id}" class="profile mb-2">
<h5>${u.firstName} ${u.lastName}</h5>
<p class="mb-1">${u.email}</p>
<p class="text-primary fw-bold">${u.company.name}</p>
<button class="btn btn-primary w-100" onclick="profile(${u.id})">View Profile</button>
</div>
</div>
</div>`;
});
$("#user-container").html(cards);
}

function profile(id){
let u=users.find(x=>x.id==id);
$("#profileBody").html(`
<div class="text-center">
<img src="https://i.pravatar.cc/150?img=${u.id}" class="profile mb-3">
<h4>${u.firstName} ${u.lastName}</h4>
</div>
<table class="table table-bordered">
<tr><th>Email</th><td>${u.email}</td></tr>
<tr><th>Phone</th><td>${u.phone}</td></tr>
<tr><th>Age</th><td>${u.age}</td></tr>
<tr><th>Gender</th><td>${u.gender}</td></tr>
<tr><th>Company</th><td>${u.company.name}</td></tr>
<tr><th>Department</th><td>${u.company.department}</td></tr>
<tr><th>Address</th><td>${u.address.address}, ${u.address.city}, ${u.address.state}</td></tr>
</table>`);
new bootstrap.Modal(document.getElementById("profileModal")).show();
}
</script>

</body>
</html>
