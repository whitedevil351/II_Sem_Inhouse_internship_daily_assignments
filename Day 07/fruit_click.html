<!DOCTYPE html>
<html>
<head>
    <title>Fruit Game</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Full screen overlay */
        #screen{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(194, 225, 153, 0.6);
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            color:white;
            z-index:100;
        }

        /* Fruit images */
        img{
            width:150px;
            position:absolute;
            cursor:pointer;
        }
    </style>
</head>

<body>

<!-- Score Board -->
  <div class="container text-center mt-3">

    <h2>Fruit Game</h2>

    <h4>Time : <span id="time">30</span></h4>

    <h4>
        Apple : <span id="apple">0</span>
        &nbsp;&nbsp;
        Banana : <span id="banana">0</span>
    </h4>

 </div>

  <!-- Start / Game Over Screen -->
 <div id="screen">

    <h1 id="message">Fruit Game</h1>

    <button class="btn btn-primary mt-3" onclick="startGame()">
        Start Game
    </button>

   </div>

  <!-- Apple -->
  <img src="apple.jpg"
     onclick="move(this,'apple')">

  <!-- Banana -->
  <img src="banana.jpeg"
     onclick="move(this,'banana')">

  <script>
   // Apple Score
    let apple = 0;
   // Banana Score
    let banana = 0;
   // Timer
    let time = 30;
    // Game Running or Not
    let play = false;
   // Timer Variable
    let timer;
  // Start Game
    function startGame(){
    // Reset Values
        apple = 0;
        banana = 0;
        time = 30;
        play = true;

        // Update Score
        document.getElementById("apple").innerHTML = apple;
        document.getElementById("banana").innerHTML = banana;
        document.getElementById("time").innerHTML = time;

        // Hide Overlay
        document.getElementById("screen").style.display = "none";

        // Timer Start
        timer = setInterval(function(){

            time--;
            // Update Time 
            document.getElementById("time").innerHTML = time;

            // Game Over
            if(time==0){

                clearInterval(timer);

                play = false;
                document.getElementById("screen").style.display = "flex";
                document.getElementById("message").innerHTML = "GAME OVER";

            }

        },1000);

     } // Move Fruit
      function move(img,type){

        // Stop Clicking After Game Over
        if(play==false)
            return;

        // Apple Score
        if(type=="apple"){
             apple++;

            document.getElementById("apple").innerHTML = apple;

        }

        // Banana Score
        else{

            banana++;

            document.getElementById("banana").innerHTML = banana;

        }

        // Random Position
        img.style.left = Math.random()*900 + "px";

        img.style.top = Math.random()*450 + "px";

    }
    
</script>

</body>
</html>
