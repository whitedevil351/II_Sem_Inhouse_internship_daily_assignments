<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Cards</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body class="bg-light">

<div class="container py-5">

    <h2 class="text-center mb-4">Student Records</h2>

    <input type="text"
           id="search"
           class="form-control mb-4"
           placeholder="Search Student">

    <div id="container" class="row g-4"></div>

</div>

<script>

const students = [
    {
        name: "Rahul",
        branch: "CSE",
        cgpa: "8.5"
    },
    {
        name: "Mayank",
        branch: "CSE(DS)",
        cgpa: "8.2"
    },
    {
        name: "Jatin",
        branch: "CSE(AI)",
        cgpa: "8.5"
    }
];

function displayStudents(data)
{
    let html = "";

    for(let i = 0; i < data.length; i++)
    {
        html += `
        <div class="col-md-4 card-item">

            <div class="card shadow">

                <div class="card-body">

                    <h4>${data[i].name}</h4>

                    <button class="btn btn-primary btn-sm mt-2 show-btn">
                        Show Details
                    </button>

                    <div class="details mt-3" style="display:none;">

                        <p><strong>Branch:</strong> ${data[i].branch}</p>

                        <p><strong>CGPA:</strong> ${data[i].cgpa}</p>

                    </div>

                </div>

            </div>

        </div>
        `;
    }

    $("#container").html(html);

    $(".show-btn").click(function(){

        $(this).next(".details").slideToggle();

    });

}

// First time all students
displayStudents(students);

// Search
$("#search").keyup(function(){

    let value = $(this).val().toLowerCase();

    let filteredStudents = students.filter(function(student){

        return student.name.toLowerCase().includes(value) ||
               student.branch.toLowerCase().includes(value);

    });

    displayStudents(filteredStudents);

});


</script>

</body>

</html>
